name: CI

on:
  pull_request:
  push:
    branches: [main, dev]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: backend } }
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: erpatio_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://postgres:ci-only-password@localhost:5432/erpatio_test
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: 22, cache: npm, cache-dependency-path: backend/package-lock.json }
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test # real Postgres: migrations, RLS, ledger triggers, auth, security
      - run: npm run build
      - run: npm run audit # high/critical production vulnerabilities fail the build

  frontend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: frontend } }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: 22, cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run audit

  e2e:
    # A real browser against the built app and the seeded demo workspace: every main screen at desktop and phone width.
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: erpatio_e2e
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:ci-only-password@localhost:5432/erpatio_e2e
      DATABASE_URL_DIRECT: postgresql://postgres:ci-only-password@localhost:5432/erpatio_e2e
      AUTH_RATE_PER_MINUTE: '1000'
      HIBP_ENABLED: 'false'
      NODE_ENV: development
      PORT: '8124'
      STATIC_DIR: ../frontend/dist
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: 22 }
      - name: Throwaway secrets for this run only
        run: |
          echo "JWT_SECRET=$(head -c48 /dev/urandom | base64 -w0)" >> "$GITHUB_ENV"
          echo "MASTER_KEY=$(head -c32 /dev/urandom | base64 -w0)" >> "$GITHUB_ENV"
      - run: npm ci && npm run build
        working-directory: frontend
      - run: npm ci && npm run build && npm run migrate && npx tsx scripts/seed-demo.ts --reset
        working-directory: backend
      - name: Start the app
        working-directory: backend
        run: |
          node dist/server.js > ../server.log 2>&1 &
          for i in $(seq 1 30); do curl -fs http://localhost:8124/healthz && break; sleep 1; done
      - run: npm ci && BASE_URL=http://localhost:8124 BROWSER=chrome node smoke.mjs
        working-directory: e2e
      - name: Server log on failure
        if: failure()
        run: tail -50 server.log

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 0 }
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  codeql:
    runs-on: ubuntu-latest
    permissions: { contents: read, security-events: write }
    steps:
      - uses: actions/checkout@v7
      - uses: github/codeql-action/init@v4
        with: { languages: javascript-typescript }
      - uses: github/codeql-action/analyze@v4
