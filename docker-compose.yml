# Local development database only (NFR-17, amended by ADR-006). The API and the web app run with npm.
#   docker compose up -d db
# Then in backend/: cp .env.example .env && npm run migrate && npm run seed:demo
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: erpatio_owner
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
      POSTGRES_DB: erpatio
    ports:
      - '127.0.0.1:5432:5432' # bound to localhost only
    volumes:
      - erpatio_pg:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U erpatio_owner -d erpatio']
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  erpatio_pg:
