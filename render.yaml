# Render Blueprint (ADR-007). One web service: Express API + the built React app on the same origin.
# Neon hosts PostgreSQL; its connection strings are secrets, entered in the Render dashboard.
services:
  - type: web
    name: erpatio
    runtime: node
    plan: free
    region: singapore # closest to the Philippines; keep the Neon project in the same region (ap-southeast-1)
    branch: main
    autoDeploy: true
    healthCheckPath: /health
    buildCommand: >-
      cd frontend && npm ci && npm run build &&
      cd ../backend && npm ci --include=dev && npm run build
    # Migrations run on every start (pre-deploy commands are not available on the free plan).
    # They are idempotent and use the DIRECT Neon URL.
    startCommand: cd backend && npm run migrate && node dist/server.js
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: NODE_ENV
        value: production
      - key: TRUST_PROXY # Render puts one proxy in front; needed for correct client IPs and rate limits
        value: 1
      - key: COOKIE_SECURE
        value: true
      - key: DOCS_ENABLED # serves /api/v1/openapi.json; set false once the demo is retired
        value: true
      - key: STATIC_DIR
        value: ../frontend/dist
      - key: DEMO_MAX_ENTRIES
        value: 100
      - key: SIGNUP_ENABLED # leave false until SMTP_URL is set and tested
        value: false
      - key: HIBP_ENABLED
        value: true
      - key: MASTER_KEY # 32 random bytes, base64. Generate once, keep a copy offline: losing it makes encrypted data unreadable
        sync: false
      - key: APP_URL # the public address of this service, used in emailed links
        sync: false
      - key: SMTP_URL # optional until sign-up is opened
        sync: false
      - key: MAIL_FROM
        sync: false
      - key: JWT_SECRET # generated once by Render (random, 256-bit); rotate with JWT_SECRET_PREVIOUS
        generateValue: true
      - key: DATABASE_URL # Neon POOLED string (host contains "-pooler")
        sync: false
      - key: DATABASE_URL_DIRECT # Neon DIRECT string, used by migrations
        sync: false
